<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudantes Cadastrar</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .invalid-feedback{
            display: block;
        }
    </style>

</head>
<body>

    <div class="container">

        <form th:action="@{/estudantes/salvar}" method="post" enctype="multipart/form-data" th:object="${estudante}"> <!--Para enviar multipart/form para enviar files, esse th:object é o Binding fort -->
            <div class="mb-3">                                                                                        <!--Ele define que esse formulario é para a classe estudante.-->

                <label class="form-label">Nome: </label>
                <input class="form-control" type="text" name="nome" th:field="*{nome}"> <!--é o nome preenchido.-->
                <div class="invalid-feedback" th:if="${#fiels.hasErrors('nome')}"> <!--Só apresenta se tiver erros-->
                    <span th:errors="*{nome}"></span>
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Data de Ingresso: </label>
                <input class="form-control" type="date" name="dataIngresso">

            </div>

            <div class="mb-3">

                <label> <input class="form-check-input" type="checkbox" name="habilidades" value="HTML"> HTML </label>
                <label> <input class="form-check-input" type="checkbox" name="habilidades" value="CSS"> CSS </label>
                <label> <input class="form-check-input" type="checkbox" name="habilidades" value="JS"> JavaScript </label>
                
            </div>

            <div class="mb-3">
                <label class="form-label">Avatar: </label>
                <input type="file" name="avatar" class="form-control">
            </div>

            <div class="mb-3">

                <input type="submit" class="btn btn-success">

            </div>
        </form>
    </div>

    
</body>
</html>
